<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Enemy Patrol Alert Reset State Machine</title>
  <desc id="desc">Detailed enemy state machine showing Patrol, Alert, and Reset states with transition conditions and gameplay actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e2a44"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35415f"/>
      <stop offset="1" stop-color="#222a40"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8ff7ff"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="24" fill="url(#bg)"/>
  <text x="36" y="52" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Enemy State Machine: Patrol → Alert → Reset</text>
  <text x="36" y="84" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Each enemy stores state, patrol bounds, detection range, reset range, direction, and speed; updateEnemy() evaluates transitions every frame.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(70 170)">
      <rect width="210" height="138" rx="18" fill="url(#node)" stroke="#f2bd43" stroke-width="3"/>
      <text x="24" y="34" fill="#ffffff" font-size="22" font-weight="700">PATROL</text>
      <text x="24" y="66" fill="#dbeafe" font-size="16">Action:</text>
      <text x="24" y="90" fill="#cbd5e1" font-size="15">Walk between patrolMinX</text>
      <text x="24" y="112" fill="#cbd5e1" font-size="15">and patrolMaxX.</text>
    </g>

    <g transform="translate(380 170)">
      <rect width="210" height="138" rx="18" fill="url(#node)" stroke="#ff6b6b" stroke-width="3"/>
      <text x="24" y="34" fill="#ffffff" font-size="22" font-weight="700">ALERT</text>
      <text x="24" y="66" fill="#dbeafe" font-size="16">Action:</text>
      <text x="24" y="90" fill="#cbd5e1" font-size="15">Chase player direction</text>
      <text x="24" y="112" fill="#cbd5e1" font-size="15">at 1.35× patrol speed.</text>
    </g>

    <g transform="translate(680 170)">
      <rect width="210" height="138" rx="18" fill="url(#node)" stroke="#89b6ff" stroke-width="3"/>
      <text x="24" y="34" fill="#ffffff" font-size="22" font-weight="700">RESET</text>
      <text x="24" y="66" fill="#dbeafe" font-size="16">Action:</text>
      <text x="24" y="90" fill="#cbd5e1" font-size="15">Return to patrolMinX,</text>
      <text x="24" y="112" fill="#cbd5e1" font-size="15">then face right.</text>
    </g>
  </g>

  <g stroke="#8ff7ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M280 230 C320 230, 340 230, 380 230"/>
    <path d="M590 230 C630 230, 640 230, 680 230"/>
    <path d="M730 310 C610 435, 280 435, 170 310"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#f8fafc">
    <rect x="292" y="194" width="78" height="48" rx="10" fill="rgba(15,23,42,0.82)" stroke="#8ff7ff"/>
    <text x="302" y="214">distance</text>
    <text x="302" y="234">&lt; detect</text>

    <rect x="604" y="194" width="64" height="48" rx="10" fill="rgba(15,23,42,0.82)" stroke="#8ff7ff"/>
    <text x="614" y="214">distance</text>
    <text x="614" y="234">&gt; reset</text>

    <rect x="396" y="398" width="168" height="48" rx="10" fill="rgba(15,23,42,0.82)" stroke="#8ff7ff"/>
    <text x="410" y="418">enemy.x reaches</text>
    <text x="410" y="438">patrolMinX</text>
  </g>

  <g transform="translate(72 365)" font-family="Inter, Arial, sans-serif">
    <rect width="816" height="86" rx="16" fill="rgba(12,17,29,0.72)" stroke="#4e5872"/>
    <text x="24" y="32" fill="#ffffff" font-size="18" font-weight="700">Gameplay integration</text>
    <text x="24" y="60" fill="#cbd5e1" font-size="16">Contact resets the player unless the player stomps from above; stomp defeats the enemy and can satisfy later gate unlock requirements.</text>
  </g>
</svg>
