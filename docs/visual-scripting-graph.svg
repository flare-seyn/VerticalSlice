<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Visual Graph Bridge for relic-gated joystick unlock</title>
  <desc id="desc">Graph-style event flow from relic collection to joystick interaction, gate unlock, and feedback effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#202a44"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35415f"/>
      <stop offset="1" stop-color="#222a40"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8ff7ff"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="24" fill="url(#bg)"/>
  <text x="36" y="48" fill="#f2f4f8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Visual Scripting Graph: Relic-Gated Joystick Unlock</text>
  <text x="36" y="80" fill="#c9d4ea" font-family="Inter, Arial, sans-serif" font-size="16">Used as the graph screenshot for the devlog: code raises gameplay events, graph-style nodes route feedback and unlock logic.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <g transform="translate(45 150)">
      <rect width="170" height="92" rx="14" fill="url(#node)" stroke="#8ff7ff" stroke-width="2"/>
      <text x="18" y="32" fill="#ffffff" font-weight="700">On Relic Pickup</text>
      <text x="18" y="58" fill="#c9d4ea">game.js overlap()</text>
      <text x="18" y="78" fill="#c9d4ea">sets collected</text>
    </g>
    <g transform="translate(290 150)">
      <rect width="185" height="92" rx="14" fill="url(#node)" stroke="#8ff7ff" stroke-width="2"/>
      <text x="18" y="32" fill="#ffffff" font-weight="700">Count Relics</text>
      <text x="18" y="58" fill="#c9d4ea">collected / total</text>
      <text x="18" y="78" fill="#c9d4ea">updates status feedback</text>
    </g>
    <g transform="translate(550 128)">
      <rect width="190" height="136" rx="14" fill="url(#node)" stroke="#ffcf69" stroke-width="2"/>
      <text x="18" y="32" fill="#ffffff" font-weight="700">Press E at Joystick</text>
      <text x="18" y="60" fill="#c9d4ea">if relic count full:</text>
      <text x="18" y="84" fill="#c9d4ea">lever.pulled = true</text>
      <text x="18" y="108" fill="#c9d4ea">gate.locked = false</text>
    </g>
    <g transform="translate(805 150)">
      <rect width="120" height="92" rx="14" fill="url(#node)" stroke="#65df95" stroke-width="2"/>
      <text x="18" y="32" fill="#ffffff" font-weight="700">FX + UI</text>
      <text x="18" y="58" fill="#c9d4ea">graph pulse</text>
      <text x="18" y="78" fill="#c9d4ea">gate opens</text>
    </g>
  </g>

  <g stroke="#8ff7ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M215 196 C245 196, 260 196, 290 196"/>
    <path d="M475 196 C510 196, 520 196, 550 196"/>
    <path d="M740 196 C770 196, 780 196, 805 196"/>
  </g>

  <g transform="translate(90 330)" font-family="Inter, Arial, sans-serif">
    <rect width="780" height="90" rx="18" fill="rgba(12,17,29,0.72)" stroke="#4e5872"/>
    <text x="24" y="34" fill="#ffffff" font-size="18" font-weight="700">Bridge note</text>
    <text x="24" y="62" fill="#c9d4ea" font-size="16">In the web prototype this is implemented in game.js; the Unity port maps the same event flow to PlayerController.cs, RelicGateGraphBridge.cs, and GateController.cs.</text>
  </g>
</svg>
