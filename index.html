<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vertical Slice - Milestone 3 Vertical Slice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Vertical Slice – Milestone 3 Vertical Slice</h1>
    <p class="controls">
      <strong>Controls:</strong> A/D or ←/→ move, Space jump, Shift ground dash, E interact, R reset. (6-level loop)
    </p>
    <canvas id="game" width="960" height="540" aria-label="2D platformer test levels"></canvas>
    <p id="status" class="status">Complete each chamber objective, pull the joystick, and clear all 6 levels.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
